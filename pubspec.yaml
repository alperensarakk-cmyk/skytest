name: aerotest
description: AeroTest – Havacılık İngilizce Sınav Hazırlık Uygulaması
publish_to: 'none'
version: 1.0.18+28

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  purchases_flutter: ^9.16.1
  url_launcher: ^6.3.1
  in_app_review: ^2.0.11
  package_info_plus: ^8.3.0
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.9
  firebase_auth: ^5.5.2
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/logo_mark.png"
  adaptive_icon_foreground: "assets/branding/logo_mark.png"
  adaptive_icon_background: "#0B132B"

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  assets:
    - assets/sinav_sablonu.json
    - assets/sorular.json
    - assets/kaliplar.json
    - assets/kaliplar_sik.json
    - assets/kelimeler.json
    - assets/user_sozluk_ai.json
    - assets/branding/logo_mark.png
    - assets/branding/logo_full.png
    - assets/home/hero_bg.png
    - assets/home/countdown_illustration.png
    - assets/home/countdown_calendar.png
    - assets/home/countdown_calendar_icon.png
    - assets/home/card_konular.png
    - assets/home/card_kelime.png
    - assets/home/card_kaliplar.png
    - assets/home/card_haftalik.png
